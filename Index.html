<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#F2F4F6; --surface:#FFF; --ink:#1A242E; --muted:#6E7B87; --line:#DCE1E6;
    /* インジケーターの紙と同じ色にそろえる */
    --c-O:#E08575;      /* アウト済 */
    --c-D:#F4C4CB;      /* アウト前 */
    --c-S:#EDE59A;      /* ステイ 黄色 */
    --c-V:#7FC47F;      /* 空室 緑 */
    --c-X:#AAB3BB;      /* 対象外 グレー */
    --prog:#A8CBEA; --fin:#3F86CE; --chk:#6FB847;
    --action:#1B5E8C; --warn:#C77A15; --ng:#B5442F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;padding-bottom:32px;
       font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  button,select,input{font:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer;padding:0}
  button:focus-visible,select:focus-visible{outline:3px solid var(--action);outline-offset:2px}

  :root{ --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.32,.72,0,1); --hh:150px; }
  html.lock,html.lock body{overflow:hidden}
  body{-webkit-font-smoothing:antialiased}
  svg{display:block}

  /* ===== ヘッダー（サウスと同じ形） ===== */
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
         -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
         padding:10px 14px 0;padding-top:calc(10px + env(safe-area-inset-top));
         border-bottom:1px solid transparent;transition:box-shadow .25s,border-color .25s}
  header.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 18px -12px rgba(16,32,48,.35)}
  .top{display:flex;align-items:center;gap:8px}
  /* 名前を選ぶ：丸いアイコン＋名前のカプセル（サウスと同じ）。未選択は赤くやさしく脈打って気づかせる */
  .pcap{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;height:44px;padding:0 12px 0 6px;
        border-radius:22px;background:var(--surface);position:relative;cursor:pointer;
        box-shadow:0 2px 8px -2px rgba(20,33,61,.14),inset 0 0 0 .5px rgba(60,60,67,.14);
        transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
  .pcap:active{transform:scale(.97);transition-duration:.08s}
  .pav{flex:0 0 32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;
       background:#14213D;color:#fff;font-size:14px;font-weight:700;transition:background .25s}
  .pav svg{width:18px;height:18px}
  .pcap select{flex:1 1 auto;min-width:0;width:100%;-webkit-appearance:none;appearance:none;border:0;background:none;
       padding:0;font-size:16.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-overflow:ellipsis;white-space:nowrap;overflow:hidden;outline:none}
  .pchev{flex:0 0 auto;color:var(--muted)}
  .pcap.warn{background:#FFF1F0;box-shadow:inset 0 0 0 1.5px rgba(255,59,48,.55);animation:pPulse 2.4s ease-in-out infinite}
  .pcap.warn .pav{background:#FF3B30}
  .pcap.warn select,.pcap.warn .pchev{color:#C4161C}
  @keyframes pPulse{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(255,59,48,.55),0 0 0 0 rgba(255,59,48,.3)}
                    50%{box-shadow:inset 0 0 0 1.5px rgba(255,59,48,.55),0 0 0 6px rgba(255,59,48,0)}}
  /* ボタンの押し感（iOSのように少し沈む） */
  .modebtn,.btn{transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
  .modebtn:active,.btn:active{transform:scale(.96);transition-duration:.08s}
  /* ロゴ：Roomit（紺の文字＋金の鍵の輪） */
  .brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-weight:800;
         letter-spacing:-.035em;color:#14213D;white-space:nowrap}
  .brand .oo{display:inline-block;width:.97em;height:.58em;vertical-align:baseline;margin:0 .01em 0 .04em}
  .foot{text-align:center;margin:22px 0 4px;color:var(--muted);font-size:12px}
  .foot .brand{font-size:19px;margin-right:6px}
  @media (prefers-reduced-motion:reduce){ .pcap.warn{animation:none} }
  .tally{flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .tally b{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
  .tally .sl{margin:0 3px;color:#B8C0C7}
  .ibtn{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--action);transition:transform .25s var(--spring),background .15s}
  .ibtn:active{transform:scale(.88);background:#E8EEF3;transition-duration:.06s}
  #refBtn.busy svg{animation:spin .8s linear infinite}
  #refBtn.hit{color:#2E7D4F}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ハンバーガー：開くと × に変形する */
  .burger span{display:block;width:20px;height:2.2px;border-radius:2px;background:var(--ink);
               transition:transform .35s var(--ease),opacity .2s}
  .burger{gap:4.5px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .burger.open span:nth-child(1){transform:translateY(6.7px) rotate(45deg)}
  .burger.open span:nth-child(2){opacity:0;transform:scaleX(.2)}
  .burger.open span:nth-child(3){transform:translateY(-6.7px) rotate(-45deg)}
  .csub{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-height:17px;margin-top:-2px}
  .meter{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden;display:flex}
  .meter span{display:block;height:100%;width:0;transition:width .6s var(--ease)}
  .meter .m1{background:var(--chk)} .meter .m2{background:var(--fin)}
  /* 指示・回収・未送信 */
  .quick{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .qchip{display:flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:16px;font-size:14px;font-weight:600;
         transition:transform .25s var(--spring),background .15s}
  .qchip:active{transform:scale(.92);transition-duration:.06s}
  .qchip .n{min-width:19px;height:19px;line-height:19px;border-radius:10px;background:var(--ng);color:#fff;font-size:11.5px;
            font-weight:700;text-align:center;padding:0 5px}
  .qrow{display:flex;gap:6px}
  .qrow[hidden]{display:none}
  .qpill{display:flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:16px;
         background:#FDF0DC;color:#8A5300;font-size:12.5px;font-weight:800;white-space:nowrap;transition:transform .25s var(--spring)}
  .qpill:active{transform:scale(.92);transition-duration:.06s}
  .qpill::before{content:'';width:7px;height:7px;border-radius:50%;background:#E8A33D;animation:beat 1.4s ease-in-out infinite}
  .qpill.busy::before{animation-duration:.5s}
  .qpill.bad{background:#FBE3E0;color:#9B2C1F}
  .qpill.bad::before{background:#C0392B;animation:none}
  .qpill[hidden]{display:none}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(.6);opacity:.5}}
  /* 自分が作業中の部屋。横1列（多いときは横にスライド）でヘッダーを高くしない */
  .mywork{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .mywork::-webkit-scrollbar{display:none}
  .mywork:empty{display:none}
  .mywork .wk{flex:0 0 auto;background:#D3E6F8;color:var(--action);border-radius:14px;padding:5px 11px;font-size:13px;
              font-weight:600;font-variant-numeric:tabular-nums}
  .mywork .wk b{font-size:14px;margin-right:4px}
  /* 階ジャンプ */
  .floors{display:flex;gap:6px;overflow-x:auto;padding:9px 0 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .floors::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;padding:6px 14px;min-width:42px;text-align:center;border-radius:999px;font-size:13.5px;font-weight:600;
         font-variant-numeric:tabular-nums;transition:transform .25s var(--spring),background .2s,color .2s}
  .fchip:active{transform:scale(.9);transition-duration:.06s}
  .band{display:flex;align-items:center;gap:10px;margin:0 -14px;padding:8px 14px;background:#EAF2FF;font-size:13px;color:#0A4FA8}
  .band .grow{flex:1}
  .band button{font-weight:700;color:var(--action);padding:6px 4px}

  /* ===== メニュー（右から） ===== */
  .dveil{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
         transition:opacity .3s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .dveil.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(86vw,340px);background:var(--bg);
          transform:translateX(105%);transition:transform .42s var(--ease);overflow-y:auto;overscroll-behavior:contain;
          padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
          box-shadow:-10px 0 40px -10px rgba(0,0,0,.25)}
  .drawer.on{transform:none}
  .drawer .dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .drawer .dhead b{font-size:28px}
  .drawer section{background:var(--surface);border-radius:16px;padding:14px;margin-top:12px}
  .drawer section:first-of-type{margin-top:4px;padding:6px 8px}
  .drawer h4{margin:0 0 9px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
  .drawer.on section{animation:slideIn .45s var(--ease) both}
  .drawer.on section:nth-of-type(2){animation-delay:.04s}
  .drawer.on section:nth-of-type(3){animation-delay:.08s}
  @keyframes slideIn{from{opacity:0;transform:translateX(18px)}}
  .dbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;border-radius:12px;font-size:15px;font-weight:600;
        transition:background .15s,transform .25s var(--spring)}
  .dbtn:active{transform:scale(.97);transition-duration:.06s}
  .dbtn svg{color:var(--action)}
  .langs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .langs button{padding:11px;border-radius:11px;font-size:14.5px;font-weight:600;transition:transform .25s var(--spring)}
  .langs button:active{transform:scale(.95);transition-duration:.06s}
  .langs button.on{background:rgba(0,122,255,.1);color:var(--action);box-shadow:inset 0 0 0 1.5px var(--action)}
  .legend{display:grid;gap:8px;font-size:13.5px}
  .legend > span{display:flex;align-items:center;gap:10px}
  .legend i{flex:0 0 auto;display:inline-block;width:28px;height:16px;border-radius:4px}
  .dfoot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
  .dfoot .brand{font-size:18px;margin-right:4px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }

  .rack{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
  .flr{display:flex;border-bottom:1px solid var(--line)}
  .flr:last-child{border-bottom:0}
  .flr .lbl{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
            font-size:15px;font-weight:700;border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
  .cells{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px;padding:11px 8px}
  @media(min-width:560px){.cells{grid-template-columns:repeat(6,minmax(0,1fr))}}

  .cell{text-align:left;transition:transform .08s ease}
  .cell:active{transform:scale(.95)}
  .cell .rno{display:flex;align-items:center;flex-wrap:wrap;gap:2px 3px;font-size:17px;font-weight:600;
             font-variant-numeric:tabular-nums;line-height:1.25;padding:0 2px 2px}
  .cell .rno .sp{margin-left:auto}
  .cell .bdg{font-size:9.5px;font-weight:700;border-radius:3px;padding:1px 4px;line-height:1.4;flex:0 0 auto;color:#fff}
  .b-dd{background:#2F6FBF} .b-ex{background:#2E7D4F} .b-nm{background:#8C959D} .b-fl{background:#9B4F8E}

  .bar{position:relative;display:flex;align-items:center;gap:4px;height:31px;border-radius:5px;
       padding:0 4px;overflow:hidden}
  .bar .h{position:absolute;top:0;bottom:0;width:50%;z-index:0}
  .bar .h.l{left:0} .bar .h.r{right:0}
  .h.todo{background:transparent} .h.doing{background:var(--prog)} .h.done{background:var(--fin)}
  .bar.checked .h{background:var(--chk)}
  .bar::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0}
  .bar::after{content:'';position:absolute;inset:0;border-radius:5px;z-index:3;
              pointer-events:none;border:0 solid transparent}
  .bar .code,.bar .meta{position:relative;z-index:2}
  .cell .who{display:block;font-size:11px;line-height:1.3;color:var(--muted);
             padding:2px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
             min-height:15px}
  .cell .who.doing{color:var(--action);font-weight:700}
  .b-w{background:#C77A15} .b-s{background:#B5442F} .b-ec{background:#3E8E3E}
  .b-sp{background:#E8823A}
  /* 追加指示がある部屋：コードの角に赤い丸 */
  .cell.od .bar .code{box-shadow:0 0 0 2px var(--ng)}
  .cell.od .bar .code::after{content:'';position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
                             background:var(--ng);border:1.5px solid #fff}
  .bar .code{position:relative}
  .bar .code{flex:0 0 auto;min-width:22px;height:21px;background:var(--surface);border-radius:3px;
             display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 3px}
  .bar .meta{font-size:10.5px;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 3px rgba(0,0,0,.4)}

  /* 区分の地色 */
  .k-OUT .bar{background:var(--c-O)} .k-STAY .bar{background:var(--c-S)}
  .k-D .bar{background:var(--c-D)}
  .k-D .meta{color:#7A2E3A;text-shadow:none;font-weight:700}
  .k-FULL .bar{background:var(--c-S);box-shadow:inset 0 0 0 2px #9B4F8E}
  .k-V .bar{background:var(--c-V)} .k-NONE .bar{background:var(--c-X)}
  .k-STAY .meta,.k-FULL .meta,.k-V .meta{color:#3A2A2A;text-shadow:none}

  /* 締切が近い・過ぎた */
  .cell.soon .bar::after{border-width:3px;border-color:var(--warn)}
  .cell.late .bar::after{border-width:3px;border-color:var(--ng);animation:bl 1.1s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}
  @media (prefers-reduced-motion:reduce){.cell.late .bar::after{animation:none}}

  .cell.skip .rno{opacity:.5}
  .cell.skip .bar{background:var(--c-X)!important}
  .cell.skip .h{display:none}

  .modebtn{font-size:12.5px;color:var(--action);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
  .modebtn.on{background:var(--action);color:#fff;border-color:var(--action)}
  .modebtn.busy{opacity:.5}
  #refBtn.hit{background:#2E7D4F;color:#fff;border-color:#2E7D4F}
  body.pick .cell .rno::before{content:'';width:17px;height:17px;border:2px solid var(--line);
    border-radius:4px;flex:0 0 auto;margin-right:3px;background:#fff}
  body.pick .cell.sel .rno::before{background:var(--action);border-color:var(--action);
    box-shadow:inset 0 0 0 2px #fff}
  body.pick .cell.sel .bar{outline:2px solid var(--action);outline-offset:1px}

  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
    border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));
    transform:translateY(120%);transition:transform .2s}
  .actionbar.on{transform:none}
  .actionbar .n{font-size:13px;color:var(--muted);margin-bottom:8px}
  .actionbar .g{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .actionbar button{padding:12px 6px;border-radius:8px;font-size:14px;font-weight:600;
    border:1px solid var(--line);background:var(--surface)}
  .actionbar button.out{background:var(--c-O);color:#fff;border-color:var(--c-O)}
  .actionbar button.pri{background:#2F6FBF;color:#fff;border-color:#2F6FBF}
  .actionbar button.gry{background:#8C959D;color:#fff;border-color:#8C959D}
  .actionbar input[type=time]{width:100%;border:1px solid var(--line);border-radius:8px;
    padding:11px;background:var(--bg);margin-top:7px}

  .gate{margin-top:15px;padding:12px 14px;border-radius:8px;font-size:15px;line-height:1.55}
  .gate b{display:block;font-size:13px;font-weight:700;margin-bottom:3px}
  .gate.block{background:#FBEDEF;border-left:3px solid #C0768A;color:#8A3A4C}
  .gate.go{background:#EDF7EA;border-left:3px solid #4CA83D;color:#2E6A25}
  .gate.due{background:#FDF4E7;border-left:3px solid var(--warn);color:#8A5D14}
  .gate.skip{background:#F0F2F4;border-left:3px solid #8C959D;color:#4A545E}
  .gate.note{background:#EAF1FA;border-left:3px solid #2F6FBF;color:#1B4E88}
  /* 業務中の追加指示（管理画面から）。いちばん目立たせる */
  .gate.od{background:#FDECEA;border:2px solid var(--ng);color:#7E2A1B;font-weight:600}
  #dOrder:empty{display:none}

  .veil{position:fixed;inset:0;background:rgba(10,18,26,.5);opacity:0;pointer-events:none;
        transition:opacity .2s;z-index:30}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
         border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
         transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
         max-height:92vh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:-6px auto 14px}
  .sheet h2{margin:0;font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
            display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sheet h2 .tag{min-width:32px;height:26px;border-radius:5px;background:var(--bg);border:1px solid var(--line);
                 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;padding:0 8px}
  .sheet h2 small{font-size:14px;font-weight:400;color:var(--muted)}

  .site{margin-top:16px;border:1px solid var(--line);border-radius:9px;padding:13px}
  .site h3{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--muted)}
  .site .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
  .site .r + .r{border-top:1px solid var(--line)}
  .site .tog{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto}
  .site .tog::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:transform .18s}
  .site .tog.on{background:#2F6FBF}
  .site .tog.on.gry{background:#8C959D}
  .site .tog.on.sp{background:#2E7D4F}
  .site .ago{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .site .ago.old{color:var(--warn);font-weight:600}
  .site .ago.done{color:var(--chk);font-weight:600}
  .site .tog.on::after{transform:translateX(22px)}
  .site input[type=text],.site input[type=number],.site select{border:1px solid var(--line);
    border-radius:6px;padding:9px 10px;background:var(--bg);font-size:15px}
  .site input[type=number]{width:84px}
  .site .memo{width:100%;margin-top:8px}

  .steps{margin-top:18px;display:flex;flex-direction:column;gap:12px}
  .step{border:1px solid var(--line);border-radius:9px;padding:12px 13px}
  .step .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .step .nm{font-size:15px;font-weight:700}
  .step .st{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .step.done{border-color:var(--fin);background:#F4F9FD}
  .step.doing{border-color:var(--prog);background:#F7FAFD}

  .btn{padding:15px;border-radius:8px;font-size:16px;font-weight:600;text-align:center;
       background:var(--action);color:#fff;width:100%;display:block}
  .btn.fin{background:#2E7D4F}
  .btn[disabled]{opacity:.4}
  .btn.ghost{background:none;color:var(--muted);font-weight:400;font-size:14px;padding:9px;margin-top:7px}
  /* 退出のすぐ下に置かない。指がずれても届かない距離を空ける */
  .btn.far{margin-top:26px;font-size:13px;text-decoration:underline;padding:8px}
  .btn.close{background:none;color:var(--muted);font-weight:400;font-size:15px;padding:12px;margin-top:14px}

  .og .rb{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:15px;font-weight:700;
          font-variant-numeric:tabular-nums;background:var(--bg)}
  .og .tx{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.5;margin:0 0 7px}
  .og .tx .rb{flex:0 0 auto}
  .pair{display:flex;gap:8px}
  .pair .btn{margin-top:0;border:1px solid var(--line);padding:11px 6px;font-size:13.5px}
  .lock{font-size:13px;color:var(--muted);line-height:1.5}

  .empty{padding:64px 30px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:60;background:var(--ink);color:#fff;
         padding:13px 16px;border-radius:9px;font-size:15px;opacity:0;transform:translateY(12px);
         transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  /* 送れていない操作（電波切れ）の印。黄色＝あとで送る、赤＝断られた */
  .qrow{display:flex;gap:8px;margin-top:8px}
  .qrow[hidden]{display:none}
  .qpill{flex:1;min-height:40px;border-radius:12px;border:1.5px solid #E0B000;background:#FFF4CC;color:#6B5200;

  .qpill.bad{flex:0 0 auto;padding:0 16px}
  .qpill.bad{background:#FDE2E2;border-color:#D93025;color:#A50E0E}

  /* =====================================================================
   * 仕上げ：iOSの質感に寄せる（サウスと同じ。上の指定を上書きする）
   * 色の意味（インジケーターの紙の色・作業中/完了の青・チェック緑）は変えない。変えるのは地の色・面・線・文字・動き。
   * ===================================================================== */
  :root{

    --fill:rgba(118,118,128,.14); --fill2:rgba(118,118,128,.08);
    --action:#007AFF; --danger:#FF3B30;
    --hair:.5px solid rgba(60,60,67,.2);

  }
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
       letter-spacing:.003em;text-rendering:optimizeLegibility}
  header{background:rgba(242,242,247,.74);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
         padding-left:16px;padding-right:12px}

  .tally b{font-size:24px;letter-spacing:-.035em}

  .qchip{background:var(--fill);color:var(--ink)}

  .fchip.on{background:var(--ink);color:#fff}
  .band{margin:0 -12px 0 -16px;padding:8px 16px}
  .dbtn:active{background:var(--fill2)}
  .langs button{background:var(--fill2)}
  .mywork .wk{background:rgba(0,122,255,.1);color:var(--action)}

  /* 階ごとのカード：角丸の白い面を浮かせる */
  .rack{margin:10px 8px 0;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--lift);overflow:hidden}
  .flr{border-bottom:0}

  body.pick .cell.sel .bar{outline-color:var(--action)}

  /* まとめて操作のバー：すりガラスの板 */
  .actionbar{background:rgba(249,249,251,.88);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);

  /* 部屋の詳細：下から出る板。区切りは線ではなく面で */
  .veil{background:rgba(0,0,0,.3)}

         transition:transform .42s var(--ease)}
  .grab{width:36px;background:rgba(60,60,67,.28)}
  .sheet h2{font-size:34px;font-weight:700;letter-spacing:-.03em}

  .gate.note{box-shadow:inset 4px 0 0 #2F6FBF}

  .steps{gap:10px}
  .step{border:0;background:var(--fill2);border-radius:18px;padding:13px 14px;transition:background .3s,box-shadow .3s}
  .step.doing{background:rgba(168,203,234,.18);box-shadow:inset 0 0 0 1.5px var(--prog)}

  .pair{gap:8px}
  .pair .btn{border:0;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;box-shadow:0 .5px 1.5px rgba(0,0,0,.12)}
  .site{border:0;background:var(--fill2);border-radius:18px;padding:12px 14px}

  .site input[type=text],.site input[type=number],.site select{border:0;background:var(--surface);border-radius:10px;box-shadow:0 .5px 1.5px rgba(0,0,0,.12)}
  .site .tog{width:51px;height:31px;border-radius:15.5px;background:rgba(120,120,128,.24)}
  .site .tog::after{top:2px;left:2px;width:27px;height:27px;border-radius:13.5px;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
                    transition:transform .3s var(--spring),width .2s}
  .site .tog.on::after{transform:translateX(20px)}
  .og .rb{border:0;background:var(--fill2);border-radius:9px}

  /* お知らせ：濃いすりガラス */
  .toast{left:12px;right:12px;max-width:480px;margin:0 auto;border-radius:18px;font-weight:500;

</style>

    ddSetBtn:'セット済', ddOkBtn:'確認済', ordBtn:'指示', ordTitle:'今日の指示',
    oEarly:'アーリーイン', oIn:'{t} イン（{d} までに仕上げ）', oOut:'{t} アウト', oNext:'翌日回し（今日は清掃しない）',
    oNote:'特記', oNone:'今日の指示はありません', oWnew:'Wメイク 新規', oWrel:'Wメイク 解除',
    cfOn:'{r}「{w}」を記録します。', cfOff:'{r}「{w}」の記録を消します。',
    ddSetTask:'DDセット', ddCheckTask:'DDチェック', afterDdSet:'DDセットの完了後',
    ddNoWork:'DD（備品 不要）なので作業はありません', cancelBtn:'取消', collect:'回収'
  };
  if (typeof T === 'undefined' || !T.ja) return;
  Object.keys(add).forEach(k => { if (!T.ja[k]) T.ja[k] = add[k]; });
})();
</script>
<script>
const TASKS = ['clean', 'check'];
let BOARD = {rooms:[], staffList:[], counts:{}}, CUR = null, busy = false;
let PICK = false, SEL = new Set(), PENDING = new Set();
let REV = -1, LOADING = false;
/** 自分の操作の返事の rev は、自分の分（+1）だけ進んだときだけ合わせる。
 *  他の端末の変更も入っていたら合わせずにおき、次の確認（7秒ごと）で読み直す */
function adoptRev(r){ if (r && Number(r) === REV + 1) REV = Number(r); }

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),3000); }
function me(){ return $('staff').value; }
function nowHM(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }
function minsUntil(t){
  const m = String(t||'').match(/^(\d{2}):(\d{2})$/);
  if (!m) return null;
  const d = new Date();
  return (+m[1]*60 + +m[2]) - (d.getHours()*60 + d.getMinutes());
}

/* ---------- 描画 ---------- */
/* 特別清掃の枠名はホテルの指定で毎月変わる。名前が空の枠は隠す */
let SPNAMES = null;
/**
 * その部屋の特別清掃を前回いつやったか。詳細を開くたびに読む。
 *
 * 月内に1周するローテーションなので、今月すでに済んだ項目は行ごと隠す。
 * ただし今日やったぶんは押し間違いを直せるよう残しておく。
 */
function loadRoomSp(room){
  [0,1,2].forEach(i => {
    $('agSp'+i).textContent = '';
    $('agSp'+i).className = 'ago';
  });
  google.script.run.withSuccessHandler(rows=>{
    if (!CUR || CUR.room !== room) return;
    const today = todayStr();
    rows.forEach((x, i) => {
      const el = $('agSp'+i), row = $('rSp'+i);
      if (!x.name) { row.style.display = 'none'; return; }

      // 今日やった → 出したまま。取り消せるようにする
      if (x.last === today) {
        row.style.display = '';
        el.textContent = t('spToday');
        el.className = 'ago done';
        return;
      }
      // 今月すでに済み → 隠す
      if (x.last) { row.style.display = 'none'; return; }

      row.style.display = '';
      el.textContent = t('spNone');
      el.className = 'ago old';
    });

    // 3つとも隠れたら見出しごと消す
    const any = [0,1,2].some(i => $('rSp'+i).style.display !== 'none');
    $('spBox').style.display = any ? '' : 'none';
  }).withFailureHandler(()=>{}).getRoomSpecial(room);
}

function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function loadSpNames(){
  google.script.run.withSuccessHandler(c=>{
    SPNAMES = c.names;
    [0,1,2].forEach(i=>{
      const nm = c.names[i] || '';
      $('lbSp'+i).textContent = nm;
      $('rSp'+i).style.display = nm ? '' : 'none';
    });
  }).withFailureHandler(()=>{}).getSpecialNames(null);
}

function render(b){
  if (b.now) CLOCK_OFF = b.now - Date.now();
  overlayOutbox(b);
  const same = BOARD.rooms.length === b.rooms.length
    && BOARD.rooms.every((r,i) => r.room === b.rooms[i].room)
    && b.rooms.length && $('c-' + b.rooms[0].room);
  BOARD = b;
  if (OUTBOX.length) recount();
  syncStaff(b.staffList);
  updateCounts();
  $('empty').hidden = b.rooms.length > 0;
  if (same) b.rooms.forEach(paintRoom); else buildRack(b.rooms);
  if (ORDOPEN) drawOrd();
  if (COLOPEN) drawCollect();
}

function syncStaff(list){
  const sel = $('staff'), sig = list.join('|');
  const keep = sel.value || localStorage.getItem('staff') || '';
  const valid = list.indexOf(keep) >= 0;
  if (sel.dataset.sig !== sig){
    // value を明示する。省くと「上原  真輝人」のような空白の2つ続く名前をブラウザが1つに詰めて一致しなくなる
    sel.innerHTML = (valid ? '' : '<option value="">'+esc(t('selNameS'))+'</option>')
      + list.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')
      + '<option value="' + HELP_OPT + '">' + esc(t('helperAdd')) + '</option>';
    sel.dataset.sig = sig;
    sel.value = valid ? keep : '';
  }
  paintWho();
}

/** 名前のカプセルの見た目（頭文字・未選択の赤） */
const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>';
/* ---------- 応援の人 ----------
 * 別の施設から来た人は名簿に無いので、ここで名前を入れてもらう（何人でも。「、」で区切れば一度に入る）。
 * サーバーの名簿に「応援」として今日だけ載るので、他の端末にも同じ表記で出る。 */
const HELP_OPT = '__helper__';
let HELPER_BUSY = false;
function addHelperName(){
  const sel = $('staff');
  const prev = localStorage.getItem('staff') || '';
  // 選択は元に戻しておく（やめたとき・失敗したときに「＋ 応援の人」のまま残らないように）
  sel.value = BOARD.staffList.indexOf(prev) >= 0 ? prev : '';
  paintWho();
  if (HELPER_BUSY) return;
  // 1人入れるとすぐ次の人の欄が出る。空欄で OK（またはキャンセル）を押したら終わり
  const names = [];
  for (let i = 0; i < 20; i++) {
    const msg = i === 0 ? t('helperMsg') : t('helperMore', { n: names.join('・') });
    const v = (prompt(msg, '') || '').trim();
    if (!v) break;
    names.push(v);
  }
  if (!names.length) return;
  const name = names.join('、');
  HELPER_BUSY = true;
  try {
    google.script.run
      .withSuccessHandler(r => {
        HELPER_BUSY = false;
        localStorage.setItem('staff', r.name);
        BOARD.staffList = r.staffList;
        const s = $('staff');
        s.innerHTML = ''; s.dataset.sig = '';   // 作り直して、いま入れた名前を選んだ状態にする
        syncStaff(r.staffList);
        drawMyWork(); if (CUR) fillSheet(CUR);
        toast(t('helperAdded', { n: r.names.join('・') }));
      })
      .withFailureHandler(err => { HELPER_BUSY = false; toast((err && err.message) || t('failed')); })
      .addHelper(name);
  } catch (e) { HELPER_BUSY = false; toast(t('failed')); }
}

function paintWho(){
  const v = $('staff').value === HELP_OPT ? '' : $('staff').value;
  $('pcap').classList.toggle('warn', !v);
  $('pav').innerHTML = v ? esc(String(v).trim().charAt(0)) : PERSON_SVG;
}

function updateCounts(){
  const c = BOARD.counts || {};
  $('cDone').textContent = c.done || 0;
  $('cAll').textContent  = c.total || 0;
  $('cSub').textContent  = t('checked') + ' ' + (c.checked||0)
    + (c.dd ? '　DD ' + c.dd : '');
  $('bar1').style.width = c.total ? (c.checked/c.total*100)+'%' : '0';
  $('bar2').style.width = c.total ? ((c.done-c.checked)/c.total*100)+'%' : '0';
  // 回収したのにチェッカーがまだ確認していない部屋の数
  const n = BOARD.rooms.filter(r => (r.pickup || r.bag) && !r.collectOk).length;
  $('colN').hidden = !n; $('colN').textContent = n;
  // 業務中の追加指示が入っている部屋の数
  const o = BOARD.rooms.filter(r => r.order).length;
  $('ordN').hidden = !o; $('ordN').textContent = o;
  drawMyWork();
}

/** 自分が入室したまま退出していない部屋。押すとその部屋を開く（中身が変わったときだけ描き直す） */
function drawMyWork(){
  const nm = me(), a = [];
  if (nm) BOARD.rooms.forEach(r => TASKS.forEach(k => {
    if (r[k].state === 'doing' && r[k].staff === nm) a.push([r.room, taskLabel(r, k), r[k].start]);
  }));
  const html = a.map(x => '<button class="wk" onclick="openSheet(\''+esc(x[0])+'\')"><b>'+esc(x[0])+'</b>'
      + esc(t('working') + ' ' + x[1] + ' ' + x[2] + '〜') + '</button>').join('');
  const box = $('myWork');
  if (box.dataset.h !== html){ box.innerHTML = html; box.dataset.h = html; }
}

function buildRack(rooms){
  const floors = [];
  rooms.forEach(r=>{
    const f = r.floor || 'その他';
    let g = floors.filter(x=>x.name===f)[0];
    if (!g) floors.push(g = {name:f, list:[]});
    g.list.push(r);
  });
  floors.sort((a,b)=>parseInt(b.name,10)-parseInt(a.name,10));   // 上の階から
  $('rack').innerHTML = floors.map(g=>
    '<div class="rack" id="f-'+esc(g.name)+'"><div class="flr"><div class="lbl">'+esc(g.name)+'</div>'
    + '<div class="cells">' + g.list.map(cell).join('') + '</div></div></div>').join('');
  $('floors').innerHTML = floors.map(g => '<button class="fchip" onclick="jumpFloor(\'' + esc(g.name) + '\', this)">'
    + esc(g.name) + '</button>').join('');
  measureHeader();
}

/** 階ジャンプ：ヘッダーの下にその階が来るようにする */
function jumpFloor(f, btn){
  const el = $('f-' + f);
  if (!el) return;
  document.querySelectorAll('.fchip').forEach(b => b.classList.toggle('on', b === btn));
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - $('hdr').offsetHeight - 6, behavior: 'smooth' });
}
function measureHeader(){ document.documentElement.style.setProperty('--hh', $('hdr').offsetHeight + 'px'); }

/** メニュー（右から出る） */
function toggleMenu(open){
  const on = open === undefined ? !$('drawer').classList.contains('on') : !!open;
  $('drawer').classList.toggle('on', on); $('dveil').classList.toggle('on', on);
  $('menuBtn').classList.toggle('open', on); $('menuBtn').setAttribute('aria-expanded', on);
  $('drawer').setAttribute('aria-hidden', !on);
}

function paintRoom(r){
  const el = $('c-' + r.room);
  if (!el) return;
  if (el.dataset.sig === sigOf(r)) return;
  el.outerHTML = cell(r);
}
function paint(room){
  const r = BOARD.rooms.filter(x=>x.room===room)[0];
  if (r) paintRoom(r);
}

/** Wメイク（寝具を2人分）が要る部屋。新規・継続・常設 */
function isW(r){ return ['新規','継続','常設'].indexOf(r.dmake) >= 0; }

function sigOf(r){
  return [r.kbn, r.code, r.clean.state, r.check.state, r.clean.minutes, r.dueIn, r.clean.staff,
          r.dmake, r.eco?1:0, spLeft(r), r.order ? 1 : 0,
          r.dd?1:0, r.skip?1:0, r.noMake?1:0, r.fullClean?1:0, hasSp(r)?1:0,
          gate(r), SEL.has(r.room)?1:0].join('|');
}

function hasSp(r){ return !!(r.spAircon || r.spDrain || r.spTv); }

/** 今月まだ済んでいない特別清掃の数。今日ONにしたものは済みとして数える */
const SP_KEYS = ['spAircon', 'spDrain', 'spTv'];
function spLeft(r){
  return (r.spTodo || []).filter((p, i) => p && !r[SP_KEYS[i]]).length;
}

/** 地色のクラス。区分で分ける */
function colorOf(r){
  if (r.kbn === 'OUT' && r.code === 'D') return 'k-D';
  return 'k-' + (r.kbn || 'NONE');
}

/** 状態: skip / late / soon / '' */
function gate(r){
  if (r.skip) return 'skip';
  if (r.clean.state === 'done') return '';
  const m = minsUntil(r.dueIn);
  if (m === null) return '';
  if (m < 0)  return 'late';
  if (m <= 30) return 'soon';
  return '';
}

function cell(r){
  const g = gate(r);
  const done = r.clean.state === 'done';
  const ckd  = r.check.state === 'done';
  const m = minsUntil(r.dueIn);

  const meta = r.skip ? t('skipTile')
    : ckd  ? t('check') + ' ' + r.check.finish
    : done ? (r.clean.minutes||0) + t('min')
    : g === 'late' ? t('dueOver', {n: Math.abs(m)})
    : g === 'soon' ? t('dueLeft', {n: m})
    : r.dueIn ? t('due', {t: r.dueIn})
    : (r.kbn === 'OUT' && r.code === 'D' && r.clean.state === 'todo') ? t('outBefore') : '';

  const bdg = (r.dd ? '<span class="bdg b-dd">DD</span>' : '')
    + (r.noMake ? '<span class="bdg b-nm">NM</span>' : '')
    + (r.fullClean ? '<span class="bdg b-fl">フル</span>' : '')
    + (isW(r) ? '<span class="bdg b-w">W</span>' : '')
    + (r.dmake === '解除' ? '<span class="bdg b-s">S</span>' : '')
    + (r.eco ? '<span class="bdg b-ec">EC</span>' : '')
    + (hasSp(r) ? '<span class="bdg b-ex">特</span>' : '')
    + (spLeft(r) ? '<span class="bdg b-sp">特' + spLeft(r) + '</span>' : '');

  const cls = [colorOf(r), g, SEL.has(r.room)?'sel':'', r.order?'od':''].filter(Boolean).join(' ');
  const mark = r.kbn === 'OUT' ? (r.code === 'D' ? 'D' : 'O')
             : r.kbn === 'FULL' ? 'F' : r.kbn === 'V' ? 'V' : 'S';

  // 清掃に入った人の名前。入室した時点から出して、退出後・チェック後も残す
  const who = r.clean.staff ? shortName(r.clean.staff) : '';
  const whoCls = r.clean.state === 'doing' ? 'who doing' : 'who';

  return '<button id="c-'+esc(r.room)+'" data-sig="'+esc(sigOf(r))+'" class="cell '+cls+'" '
    + 'onclick="tap(\''+esc(r.room)+'\')">'
    + '<span class="rno">'+esc(r.room)+bdg+'<span class="sp"></span></span>'
    + '<span class="bar'+(ckd?' checked':'')+'">'
    +   '<span class="h l '+r.clean.state+'"></span><span class="h r '+r.check.state+'"></span>'
    +   '<span class="code">'+mark+'</span><span class="meta">'+esc(meta)+'</span>'
    + '</span>'
    + '<span class="'+whoCls+'">'+esc(who)+'</span>'
    + '</button>';
}

/** タイルに収まるよう苗字だけにする。区切りが無ければ先頭4文字 */
function shortName(n){
  const s = String(n || '').trim();
  const p = s.split(/[\s　]+/);
  return p.length > 1 ? p[0] : s.slice(0, 4);
}

/* ---------- 選択モード ---------- */
function tap(room){
  if (!PICK) return openSheet(room);
  if (SEL.has(room)) SEL.delete(room); else SEL.add(room);
  paint(room); syncBar();
}
function togglePick(on){
  PICK = on === undefined ? !PICK : !!on; SEL.clear();
  document.body.classList.toggle('pick', PICK);
  $('pband').hidden = !PICK; measureHeader();
  BOARD.rooms.forEach(paintRoom); syncBar();
}
function syncBar(){
  $('abar').classList.toggle('on', PICK && SEL.size > 0);
  $('abarN').textContent = t('selN', {n: SEL.size});
}

function bulkCode(code){
  if (!SEL.size || busy) return;
  // アウトの部屋だけが対象。ステイや空室を選んでいても触らない
  const rooms = Array.from(SEL).filter(no => {
    const r = BOARD.rooms.filter(x => x.room === no)[0];
    return r && r.kbn === 'OUT';
  });
  if (!rooms.length) { toast(t('onlyOut')); return; }
  const word = code === 'O' ? t('outDone') : t('outBefore');
  if (!confirm(t('cfBulk', {n: rooms.length, w: word}))) return;

  rooms.forEach(no => {
    const i = BOARD.rooms.map(x => x.room).indexOf(no);
    if (i >= 0) BOARD.rooms[i].code = code;
  });
  recount(); updateCounts(); rooms.forEach(paint);

  toast(t('selN', {n: rooms.length}) + '　' + word);
  sendBulk({ kind: 'code', rooms: rooms, code: code, at: srvNow() });
}

/** まとめて操作を送る。電波が無ければ端末に貯める（画面は変えたまま） */
function sendBulk(op){
  const later = () => { busy = false; SEL.clear(); syncBar(); BOARD.rooms.forEach(paintRoom); enqueue(op); };
  if (OUTBOX.length) { later(); return; }
  busy = true;
  send(op, false, done, e => {
    if (isNetErr(e)) { later(); toast(t('qSaved')); return; }
    ng(e);
  });
}

function bulkFlag(patch){
  if (!SEL.size || busy) return;
  const rooms = Array.from(SEL);
  const word = ('dd' in patch) ? (patch.dd ? t('ddOn') : t('ddOff'))
                               : (patch.skip ? t('skipOn') : t('skipOff'));
  if (!confirm(t('cfBulk', {n: rooms.length, w: word}))) return;

  // 1部屋ずつのときと同じく、清掃不要にしたらDDも立てる（日報の未清掃数＝DD数）
  const send = Object.assign({}, patch);
  if (send.skip === true) send.dd = true;

  // 返事を待たずにタイルを先に変える。179室の読み直しを待つと効いていないように見えるため
  rooms.forEach(room => {
    const i = BOARD.rooms.map(x=>x.room).indexOf(room);
    if (i >= 0) Object.keys(send).forEach(k => { BOARD.rooms[i][k] = send[k]; });
  });
  recount(); updateCounts(); rooms.forEach(paint);

  toast(t('selN', {n: rooms.length}) + '　' + word);
  sendBulk({ kind: 'flags', rooms: rooms, patch: send, at: srvNow() });
}

function bulkDue(){
  if (!SEL.size || busy) return;
  const tm = $('bulkTime').value;
  const rooms = Array.from(SEL);
  if (!confirm(t('cfBulk', {n: rooms.length, w: (tm || '—')}))) return;
  rooms.forEach(room => {
    const i = BOARD.rooms.map(x=>x.room).indexOf(room);
    if (i >= 0) BOARD.rooms[i].dueIn = tm;
  });
  rooms.forEach(paint);
  toast(t('setDue'));
  sendBulk({ kind: 'time', rooms: rooms, field: 'dueIn', value: tm, at: srvNow() });
}

function done(b){ busy=false; SEL.clear(); REV=b.rev; render(b); syncBar(); }
function ng(e){ busy=false; toast(e.message || t('failed')); load(); }

/* ---------- 詳細 ---------- */
function openSheet(room){
  const r = BOARD.rooms.filter(x=>x.room===room)[0];
  if (!r) return;
  fillSheet(r);
  $('veil').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ CUR=null; $('veil').classList.remove('on'); $('sheet').classList.remove('on'); }

function fillSheet(r){
  CUR = r;
  $('dNo').textContent = r.room;
  $('dCode').hidden = true;
  $('dKbn').textContent = t('k_' + r.kbn);

  const g = gate(r), m = minsUntil(r.dueIn);
  let html = '';
  // 業務中の追加指示（管理画面から）。入室ボタンより上に赤枠で出す
  const od = r.order ? '<div class="gate od"><b>'+esc(t('order'))+'</b>'
    + r.order.split(' / ').map(x => '・' + esc(x)).join('<br>') + '</div>' : '';
  if ($('dOrder').innerHTML !== od) $('dOrder').innerHTML = od;
  if (g === 'skip') html += '<div class="gate skip"><b>'+esc(t('g_skip'))+'</b></div>';

  if (r.dueIn && r.clean.state !== 'done'){
    html += '<div class="gate due"><b>' + esc(t('due', {t: r.dueIn})) + '</b>'
          + esc(m < 0 ? t('dueOver', {n: Math.abs(m)}) : t('dueLeft', {n: m})) + '</div>';
  }
  const ex = [];
  if (r.fullClean) ex.push(t('full'));
  if (r.noMake)    ex.push(t('nomake'));
  if (r.linen)     ex.push(t('linen'));
  if (r.extend)    ex.push(t('extend'));
  if (r.pop)       ex.push(t('pop'));
  if (isW(r))      ex.push(t('wmake') + '（' + r.dmake + '）');
  if (r.dmake === '解除') ex.push(t('single'));
  if (r.eco)       ex.push(t('eco'));
  if (r.lateOut)   ex.push(t('lateout') + ' ' + r.lateOut);
  if (ex.length || r.note){
    html += '<div class="gate note"><b>' + esc(t('ord')) + '</b>' + esc(ex.join(' / '))
          + (r.note ? (ex.length ? '<br>' : '') + esc(r.note) : '') + '</div>';
  }
  $('dGate').innerHTML = html;

  $('tgDD').classList.toggle('on', !!r.dd);
  $('tgSkip').classList.toggle('on', !!r.skip);
  $('tgPick').classList.toggle('on', !!r.pickup);
  $('tgBag').classList.toggle('on', !!r.bag);
  $('byPick').textContent = r.pickup ? (r.pickupBy || '') : '';
  $('byBag').textContent  = r.bag ? (r.bagBy || '')
    + (r.collectOk ? '　' + t('checkedBy') + ' ' + r.collectOk : '') : '';
  $('rSupply').style.display = r.dd ? '' : 'none';
  $('fSupply').value = r.supply || '要';
  $('fWater').value  = r.water === '' ? '' : r.water;
  $('fFridge').value  = r.fridge || '';
  $('fFridge2').value = r.fridgeCheck || '';
  $('fMemo').value   = r.memo || '';
  if (!CUR || CUR.room !== r.room || $('agSp0').dataset.room !== r.room) {
    $('agSp0').dataset.room = r.room;
    loadRoomSp(r.room);
  }
  $('tgAir').classList.toggle('on', !!r.spAircon);
  $('tgDrain').classList.toggle('on', !!r.spDrain);
  $('tgTv').classList.toggle('on', !!r.spTv);

  /*
   * DD（備品 要）の部屋は清掃の代わりに「DDセット」「DDチェック」。記録の列は清掃・チェックと同じ。
   * DD（備品 不要）の部屋は何も置かないので作業のボタンを出さない。
   */
  if (r.dd && r.supply === '不要') {
    $('dSteps').innerHTML = '<div class="step"><div class="lock">' + esc(t('ddNoWork')) + '</div></div>';
    return;
  }
  const dd = !!r.dd;
  $('dSteps').innerHTML = TASKS.map(k=>{
    const name = taskLabel(r, k), w = r[k];
    const info = dd
      ? (w.state==='done' ? esc(w.staff)+'　'+w.finish : w.state==='doing' ? esc(w.staff)+'　'+w.start+' 〜' : '')
      : w.state==='done'  ? esc(w.staff)+'　'+w.start+' 〜 '+w.finish+'　'+w.minutes+t('min')
      : w.state==='doing' ? esc(w.staff)+'　'+w.start+' 〜' : '';
    let btn;
    if (k === 'check' && r.clean.state !== 'done' && w.state === 'todo')
      btn = '<div class="lock">'+esc(dd ? t('afterDdSet') : t('afterClean'))+'</div>';
    // DDセット：入室・退出ではなく1回押すだけ（清掃員は「セット済」、チェッカーは「確認済」）
    else if (dd && w.state !== 'done')
      btn = me() ? '<button class="btn fin" onclick="act(\'once\',\''+k+'\')">'
                   + esc(t(k === 'clean' ? 'ddSetBtn' : 'ddOkBtn') + '（' + me() + '）') + '</button>'
                 : '<button class="btn fin" disabled>'+esc(t('pickName'))+'</button>';
    else if (dd)
      btn = '<button class="btn ghost" onclick="act(\'undo\',\''+k+'\')">'+esc(t('cancelBtn'))+'</button>';
    // ボタンに押す人の名前を出す。名前を選んでいなければ押せない
    else if (w.state==='todo')
      btn = me() ? '<button class="btn" onclick="act(\'start\',\''+k+'\')">'+esc(t('enterAs', {n: me()}))+'</button>'
                 : '<button class="btn" disabled>'+esc(t('pickName'))+'</button>';
    else if (w.state==='doing')
      btn = (me() ? '<button class="btn fin" onclick="act(\'finish\',\''+k+'\')">'+esc(t('exitAs', {n: me()}))+'</button>'
                  : '<button class="btn fin" disabled>'+esc(t('pickName'))+'</button>')
          + '<button class="btn ghost far" onclick="act(\'undo\',\''+k+'\')">'+esc(t('undo'))+'</button>';
    else
      btn = '<div class="pair">'
          + '<button class="btn ghost" onclick="act(\'reopen\',\''+k+'\')">'+esc(t('reopen'))+'</button>'
          + '<button class="btn ghost" onclick="act(\'undo\',\''+k+'\')">'+esc(t('undo'))+'</button></div>';
    return '<div class="step '+w.state+'"><div class="hd"><span class="nm">'+esc(name)+'</span>'
         + '<span class="st">'+info+'</span></div>'+btn+'</div>';
  }).join('');
}

/** 工程の名前。DDの部屋はDDセット／DDチェック */
function taskLabel(r, k){
  if (r && r.dd) return k === 'clean' ? t('ddSetTask') : t('ddCheckTask');
  return t(k);
}

/* ---------- 打刻 ---------- */
function diffMin(from){
  const m = String(from||'').match(/^(\d{2}):(\d{2})$/);
  if (!m) return 1;
  const d = new Date();
  return Math.max(1, d.getHours()*60 + d.getMinutes() - (+m[1]*60 + +m[2]));
}

function predict(r, kind, task, who, hm){
  who = who || me(); hm = hm || nowHM();
  const c = JSON.parse(JSON.stringify(r));
  const t = c[task];
  if (kind === 'start')  { t.staff = who; t.start = hm; t.finish=''; t.minutes=null; t.state='doing';
                           if (task === 'clean' && c.code === 'D') c.code = 'O'; }
  if (kind === 'finish') { t.finish = hm; t.minutes = diffMin(t.start); t.state='done'; }
  if (kind === 'reopen') { t.finish = ''; t.minutes = null; t.state='doing'; }
  if (kind === 'undo')   { c[task] = {staff:'',start:'',finish:'',minutes:null,state:'todo'}; }
  // DDセット：1回押すだけ（入室していなければ今の時刻で入室と退出を同時に記録）。コードは変えない
  if (kind === 'once')   { if (t.state === 'todo') { t.staff = who; t.start = hm; }
                           t.finish = hm; t.minutes = t.start === t.finish ? 0 : diffMin(t.start); t.state='done'; }
  return c;
}

function apply(room, obj){
  if (!obj) return;
  const i = BOARD.rooms.map(x=>x.room).indexOf(room);
  if (i < 0) return;
  if (!obj.spTodo) obj.spTodo = BOARD.rooms[i].spTodo;   // 月の残りは全体読み込みのときだけ届く
  BOARD.rooms[i] = obj;
  recount(); updateCounts(); paint(room);
  if (CUR && CUR.room === room) fillSheet(obj);
}

function recount(){
  const t = BOARD.rooms.filter(r => !r.skip && ['OUT','STAY','FULL'].indexOf(r.kbn) >= 0);
  BOARD.counts = {
    total: t.length,
    done: t.filter(r=>r.clean.state==='done').length,
    checked: t.filter(r=>r.check.state==='done').length,
    dd: BOARD.rooms.filter(r=>r.dd).length,
    skip: BOARD.rooms.filter(r=>r.skip).length
  };
}

function act(kind, task){
  if (!CUR || PENDING.has(CUR.room)) return;
  if (!me()){ toast(t('pickName')); $('staff').focus(); return; }
  const nm = taskLabel(CUR, task);
  if (kind==='undo'   && !confirm(t('cfUndo',   {r: CUR.room, t: nm}))) return;
  if (kind==='reopen' && !confirm(t('cfReopen', {r: CUR.room, t: nm}))) return;

  const room = CUR.room, staff = me(), before = CUR;
  const op = { kind: kind, task: task, room: room, staff: staff, at: srvNow() };
  holdRoom(room);
  apply(room, predict(before, kind, task));
  toast(room+' '+nm+' '+(kind==='start'?t('enter'):kind==='finish'?t('exit')
    :kind==='once'?t(task==='clean'?'ddSetBtn':'ddOkBtn'):kind==='undo'?t('undo'):t('reopen')));

  const ok = o => { releaseRoom(room); adoptRev(o && o.__rev); apply(room, o); };
  const bad = e => { releaseRoom(room); apply(room, before);
                     toast(e.message || t('failed')); };
  // 先に貯まっている操作があれば、押した順を守るため後ろに並べる
  if (OUTBOX.length) { releaseRoom(room); enqueue(op); return; }
  send(op, false, ok, e => {
    if (isNetErr(e)) { releaseRoom(room); enqueue(op); toast(t('qSaved')); return; }   // 画面はそのまま、あとで送る
    bad(e);
  });
}

function flip(key){
  if (!CUR || PENDING.has(CUR.room)) return;
  // ゴミ回収・バッグ回収：押し間違いに備えて確認する。外すとチェッカーの確認も消える
  if (key === 'pickup' || key === 'bag') {
    if (!me()){ toast(t('pickName')); $('staff').focus(); return; }
    const v = !CUR[key];
    if (!confirm(t(v ? 'cfOn' : 'cfOff', {r: CUR.room, w: t(key)}))) return;
    saveField(key, v);
    return;
  }
  // 清掃不要にした部屋はドア前に備品を置くので、DD も一緒に立てる
  if (key === 'skip' && !CUR.skip && !CUR.dd) {
    saveField2({ skip: true, dd: true });
    return;
  }
  saveField(key, !CUR[key]);
}

/**
 * 送信中の印。通信が失敗したり、呼び出し自体がエラーになっても
 * 印が残り続けて部屋ごと押せなくなるのを防ぐため、15秒で必ず外す。
 */
const PENDING_TIMER = {};
function holdRoom(room){
  PENDING.add(room);
  clearTimeout(PENDING_TIMER[room]);
  PENDING_TIMER[room] = setTimeout(() => { PENDING.delete(room); }, 15000);
}
function releaseRoom(room){
  PENDING.delete(room);
  clearTimeout(PENDING_TIMER[room]);
}

/** サーバー呼び出しを安全に投げる。呼べなかったら元に戻して知らせる */
function sendFlag(room, patch, before){
  const op = { kind: 'flag1', room: room, patch: patch, at: srvNow() };
  if (OUTBOX.length) { releaseRoom(room); enqueue(op); return; }
  send(op, false,
    f => { releaseRoom(room); if (f) adoptRev(f.__rev); applyOne_(room, f); },
    e => { releaseRoom(room);
      if (isNetErr(e)) { enqueue(op); toast(t('qSaved')); return; }
      if (before) applyOne_(room, before);
      toast(e.message || t('failed')); load(); });
}

 * 取り込んだ部屋の情報から作るので、サーバーの呼び出しは増えない。部屋番号を押すとその部屋が開く。 */

function drawOrd(){
  const R = BOARD.rooms;
  const rb = no => '<button class="rb" onclick="goRoom(\''+esc(no)+'\')">'+esc(no)+'</button>';
  const chips = a => '<div class="rs">'+a.map(rb).join('')+'</div>';

                        return Object.keys(o).sort().map(k => [k, o[k]]); };
  const pick = fn => R.filter(fn).map(r => r.room);
  const list = (title, a) => sec(title, a.length ? chips(a) : '');

  h += sec(t('order'), R.filter(r => r.order).map(r =>

  // アーリーイン（イン時刻ごと。仕上げの締切つき）
  h += sec(t('oEarly'), group(r => r.checkIn ? r.checkIn + '|' + (r.dueIn || '') : '').map(([k, a]) => {
    const p = k.split('|');
    return '<div class="ln">'+esc(p[1] ? t('oIn', {t: p[0], d: p[1]}) : p[0])+'</div>'+chips(a);
  }).join(''));

  // レイトアウト（19時以降の翌日回しは別）
  h += sec(t('lateout'), group(r => (r.kbn !== 'NONE' && r.lateOut) ? r.lateOut : '').map(([k, a]) =>
    '<div class="ln">'+esc(t('oOut', {t: k}))+'</div>'+chips(a)).join(''));
  h += sec(t('oNext'), group(r => (r.kbn === 'NONE' && r.lateOut) ? r.lateOut : '').map(([k, a]) =>
    '<div class="ln">'+esc(t('oOut', {t: k}))+'</div>'+chips(a)).join(''));

  h += list(t('full'),   pick(r => r.fullClean));
  h += list(t('nomake'), pick(r => r.noMake));
  h += list(t('extend'), pick(r => r.extend));
  h += list(t('linen'),  pick(r => r.linen));
  h += list(t('pop'),    pick(r => r.pop));
  h += list(t('eco'),    pick(r => r.eco));
  h += list(t('oWnew'),  pick(r => r.dmake === '新規'));
  h += list(t('oWrel'),  pick(r => r.dmake === '解除'));

  // 特記（同じ文は1つにまとめる）

function drawCollect(){

function cmpNo(a, b){ return (parseInt(a,10)||0) - (parseInt(b,10)||0); }

function checkCollect(room, ok){
  if (!me()){ toast(t('pickName')); return; }
  const i = BOARD.rooms.map(x => x.room).indexOf(room);
  const before = i >= 0 ? JSON.parse(JSON.stringify(BOARD.rooms[i])) : null;
  if (i >= 0) BOARD.rooms[i].collectOk = ok ? me() + ' ' + nowHM() : '';
  drawCollect();
  const op = { kind: 'collect', room: room, staff: me(), ok: ok, at: srvNow() };
  if (OUTBOX.length) { enqueue(op); return; }
  send(op, false,
    f => { if (f) { adoptRev(f.__rev); applyOne_(room, f); } drawCollect(); },
    e => { if (isNetErr(e)) { enqueue(op); toast(t('qSaved')); return; }
      if (before) applyOne_(room, before); drawCollect();
      toast(e.message || t('failed')); });
}

function saveField2(patch){
  if (!CUR) return;
  const room = CUR.room;
  const before = JSON.parse(JSON.stringify(CUR));
  holdRoom(room);
  const i = BOARD.rooms.map(x=>x.room).indexOf(room);
  if (i >= 0){ Object.keys(patch).forEach(k => { BOARD.rooms[i][k] = patch[k]; }); CUR = BOARD.rooms[i]; }
  try { recount(); updateCounts(); paint(room); fillSheet(CUR); } catch (e) {}
  sendFlag(room, patch, before);
}

function saveField(key, val){
  if (!CUR) return;
  const room = CUR.room, patch = {};
  patch[key] = val;
  const before = JSON.parse(JSON.stringify(CUR));   // 失敗したときに戻す元（書き換える前に取る）
  // 回収は押した人と時刻を残す
  if (key === 'pickup' || key === 'bag') {
    if (val && !me()) { toast(t('pickName')); $('staff').focus(); return; }
    patch.__by = me();
    if (val) CUR[key + 'By'] = me() + ' ' + nowHM();
    else { CUR[key + 'By'] = ''; CUR.collectOk = ''; }
  }
  holdRoom(room);
  const i = BOARD.rooms.map(x=>x.room).indexOf(room);
  if (i >= 0){ BOARD.rooms[i][key] = val; CUR = BOARD.rooms[i]; }
  try { recount(); updateCounts(); paint(room); fillSheet(CUR); } catch (e) {}

  // 成功しても179室ぶん作り直さない。この部屋の最新値だけ確定させる
  sendFlag(room, patch, before);
}

/** 1部屋ぶんの最新状態を、全体を作り直さずに反映する */
function applyOne_(room, f){
  if (!f) return;
  const i = BOARD.rooms.map(x=>x.room).indexOf(room);
  if (i >= 0 && !f.spTodo) f.spTodo = BOARD.rooms[i].spTodo;   // 月の残りは全体読み込みのときだけ届く
  if (i >= 0) BOARD.rooms[i] = f;
  recount(); updateCounts(); paint(room);
  if (CUR && CUR.room === room) fillSheet(f);
}

/* ---------- 読み込み ---------- */
function load(manual){
  if (LOADING) return;
  LOADING = true;
  if (manual) $('refBtn').classList.add('busy');
  google.script.run
    .withSuccessHandler(b=>{
      LOADING=false; $('refBtn').classList.remove('busy');
      REV = b.rev; render(b);
      if (OUTBOX.length) setTimeout(flush, 300);
      if (manual){ $('refBtn').classList.add('hit');
        setTimeout(()=>$('refBtn').classList.remove('hit'), 700); }
    })
    .withFailureHandler(e=>{
      LOADING=false; $('refBtn').classList.remove('busy');

    .getBoard(null);

/* ---------- 電波が切れたときの送り直し ----------
 * 送れなかった操作は端末に貯めて（閉じても消えない）、つながったら押した順に送る。
 * 記録の時刻は「押した時刻」。サーバーの時計に合わせてから送る。
 * サーバー側は、同じ人の同じ操作がもう入っていれば成功として扱う（二重記録しない）。
 * 送ったが断られた操作（ほかの人が先に完了していた等）は赤い印で残して知らせる。 */
let CLOCK_OFF = 0;                      // サーバー時刻 − 端末時刻（ミリ秒）
let OUTBOX  = readJSON('outbox');
let DROPPED = readJSON('dropped');
let FLUSHING = false;
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function readJSON(k){ try { const v = JSON.parse(store(k) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveBox(){ store('outbox', JSON.stringify(OUTBOX)); store('dropped', JSON.stringify(DROPPED)); drawOutbox(); }
function srvNow(){ return Date.now() + CLOCK_OFF; }
function hmOf(ms){ const d = new Date(ms), p = n => String(n).padStart(2,'0'); return p(d.getHours()) + ':' + p(d.getMinutes()); }
function ymdOf(ms){ const d = new Date(ms), p = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); }

/** 電波・通信の失敗か（＝あとで送り直せばいい失敗か）。サーバーが断った失敗は false */
function isNetErr(e){
  if (e && e.net) return true;
  if (navigator.onLine === false) return true;
  return /NetworkError|HTTP 0|Failed to fetch|network|timed? ?out|ネットワーク|接続|サーバー ?エラー|server error|Lock|ロック/i
    .test(String((e && e.message) || e || ''));
}

/** サーバーへ送る。返事が来ないまま14秒たったら通信失敗とみなす（あとで送り直す） */
function send(op, replay, ok, bad){
  let settled = false;
  const fin = (f, x) => { if (settled) return; settled = true; clearTimeout(tm); f(x); };
  const tm = setTimeout(() => fin(bad, { net: true, message: 'timeout' }), 14000);
  const A = replay ? [op.at] : [];
  try {
    const g = google.script.run.withSuccessHandler(x => fin(ok, x)).withFailureHandler(e => fin(bad, e));
    switch (op.kind) {
      case 'start':   g.clockStart(op.room, op.staff, op.task, ...A); break;
      case 'finish':  g.clockFinish(op.room, op.staff, op.task, ...A); break;
      case 'once':    g.clockOnce(op.room, op.staff, op.task, ...A); break;
      case 'undo':    g.clockUndo(op.room, op.task, ...A, ...(replay ? [op.staff] : [])); break;
      case 'reopen':  g.clockReopen(op.room, op.task, ...A, ...(replay ? [op.staff] : [])); break;
      case 'flag1':   g.setRoomFlag1(op.room, op.patch, ...A); break;
      case 'flags':   g.setRoomFlags(op.rooms, op.patch, ...A); break;
      case 'code':    g.setRoomCode(op.rooms, op.code, ...A); break;
      case 'time':    g.setRoomTime(op.rooms, op.field, op.value, ...A); break;
      case 'collect': g.setCollectCheck(op.room, op.staff, op.ok, ...A); break;
      default: fin(bad, { message: 'unknown' });
    }
  } catch (err) {
    // 画面とサーバーの版がずれていると、ここで関数が無いと言われる
    fin(bad, { message: t('failed') + '（画面を開き直してください）' });
  }
}

const CLOCK_KINDS = ['start', 'finish', 'once', 'undo', 'reopen'];
function enqueue(op){ OUTBOX.push(op); saveBox(); }

/** 読み直した盤面に、まだ送れていない操作を重ねる（重ねないと押す前の状態に戻って見える） */
function overlayOutbox(b){
  OUTBOX.forEach(op => {
    if (ymdOf(op.at) !== b.date) return;
    (op.rooms || [op.room]).forEach(room => {
      const i = b.rooms.map(x => x.room).indexOf(room);
      if (i < 0) return;
      const r = b.rooms[i];
      if (op.kind === 'flag1' || op.kind === 'flags') {
        Object.keys(op.patch).forEach(k => {
          if (k === '__by') return;
          r[k] = op.patch[k];
          if (k === 'pickup' || k === 'bag') {
            r[k + 'By'] = op.patch[k] ? ((op.patch.__by || '') + ' ' + hmOf(op.at)).trim() : '';
            if (!op.patch[k]) r.collectOk = '';
          }
        });
        return;
      }
      if (op.kind === 'code')    { r.code = op.code; return; }
      if (op.kind === 'time')    { r[op.field] = op.value; return; }
      if (op.kind === 'collect') { r.collectOk = op.ok ? (op.staff + ' ' + hmOf(op.at)) : ''; return; }
      b.rooms[i] = predict(r, op.kind, op.task, op.staff, hmOf(op.at));
    });
  });
}

/** 貯めた操作を先頭から1つずつ送る */
function flush(){
  if (FLUSHING || !OUTBOX.length || navigator.onLine === false) return;
  FLUSHING = true; drawOutbox();
  const op = OUTBOX[0];
  const next = () => {
    FLUSHING = false;
    if (OUTBOX.length) { flush(); return; }
    drawOutbox(); load();
  };
  send(op, true, () => {
    OUTBOX.shift(); saveBox();
    if (!OUTBOX.length) toast(t('qSent'));
    next();
  }, e => {
    if (isNetErr(e)) { FLUSHING = false; drawOutbox(); return; }   // まだつながらない。あとでまた送る
    OUTBOX.shift();
    const rooms = (op.rooms || [op.room]).join('・');
    DROPPED.push({ room: rooms, what: opLabel(op), hm: hmOf(op.at), msg: e.message || '' });
    // 入室などが断られたら、同じ部屋・同じ作業のあとの操作（退出・取り消しなど）も送らない（別の人の作業に付けない）
    if (CLOCK_KINDS.indexOf(op.kind) >= 0) {
      OUTBOX = OUTBOX.filter(x => {
        if (CLOCK_KINDS.indexOf(x.kind) < 0 || x.room !== op.room || x.task !== op.task) return true;
        DROPPED.push({ room: x.room, what: opLabel(x), hm: hmOf(x.at), msg: t('qChain') });
        return false;
      });
    }
    saveBox();
    toast(t('qDropped', { r: rooms, m: e.message || '' }));
    next();
  });
}
function flushNow(){ if (FLUSHING) return; flush(); }

function opLabel(op){
  if (op.kind === 'flag1' || op.kind === 'flags')
    return Object.keys(op.patch).filter(k => k !== '__by')
      .map(k => k === 'dd' ? 'DD' : k === 'skip' ? t('skipOn') : k === 'memo' ? t('qMemo') : t(k)).join('・');
  if (op.kind === 'code') return op.code === 'O' ? t('outDone') : t('outBefore');
  if (op.kind === 'time') return t('setDue') + ' ' + (op.value || '—');
  if (op.kind === 'collect') return t('confirmBtn');
  const W = { start: t('enter'), finish: t('exit'), undo: t('undo'), reopen: t('reopen'),
              once: t(op.task === 'clean' ? 'ddSetBtn' : 'ddOkBtn') };
  return (op.task === 'check' ? t('check') : t('clean')) + ' ' + (W[op.kind] || op.kind);
}
function drawOutbox(){
  const q = $('qPill'), d = $('qDrop');
  if (!q || !d || !$('qRow')) return;
  q.hidden = !OUTBOX.length;
  q.textContent = t('qPending', { n: OUTBOX.length });
  q.classList.toggle('busy', FLUSHING);
  d.hidden = !DROPPED.length;
  d.textContent = '! ' + DROPPED.length;
  $('qRow').hidden = !OUTBOX.length && !DROPPED.length;
}
function showDropped(){
  const lines = DROPPED.map(x => x.room + '　' + x.hm + '　' + x.what + (x.msg ? '\n　→ ' + x.msg : ''));
  alert(t('qDropTitle') + '\n\n' + lines.join('\n'));
  DROPPED = []; saveBox();
}

function checkRev(){
  if (document.hidden || LOADING || PENDING.size) return;
  google.script.run.withSuccessHandler(r=>{ if (r !== REV) load(); })
    .withFailureHandler(()=>{}).getRev(null);
}

applyLang();
loadSpNames();
$('langs').innerHTML = Object.keys(LANG_NAMES)
  .map(k => '<button class="'+(k===LANG?'on':'')+'" onclick="setLang(\''+k+'\')">'+LANG_NAMES[k]+'</button>').join('');
window.addEventListener('scroll', () => { $('hdr').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('resize', measureHeader);

$('staff').addEventListener('change', e=>{
  if (e.target.value === HELP_OPT) { addHelperName(); return; }
  if (e.target.value) localStorage.setItem('staff', e.target.value);
  paintWho();
  drawMyWork();
  if (CUR) fillSheet(CUR);      // ボタンの名前（「○○で入室」）を選び直した人に合わせる
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !PENDING.size) load(); });
window.addEventListener('focus', checkRev);
drawOutbox();
window.addEventListener('online', flush);
setInterval(flush, 15000);   // 送れていない操作の送り直し
setInterval(checkRev, 7000);
setInterval(()=>{ if(!document.hidden && !PENDING.size && !busy) load(); }, 120000);
setInterval(()=>{ if(!document.hidden) BOARD.rooms.forEach(paintRoom); }, 20000);
load();
</script>
