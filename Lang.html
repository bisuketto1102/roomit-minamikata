/** 言語ボタンに出す名前。その言語の表記で書く */
const LANG_NAMES = {
  ja:'日本語', en:'English', vi:'Tiếng Việt', ne:'नेपाली',
  my:'မြန်မာ', id:'Indonesia', zh:'简体中文'
};

/**
 * 表示する言語を決める。
 *  1. 本人が選んだもの（端末に記憶）
 *  2. 端末の言語設定
 *  3. どちらもなければ英語
 */
function pickLang(){
  const saved = localStorage.getItem('lang');
  if (saved && T[saved]) return saved;
  const nav = (navigator.language || '').toLowerCase();
  if (nav.indexOf('zh') === 0) return 'zh';
  const two = nav.slice(0, 2);
  return T[two] ? two : 'en';
}

let LANG = pickLang();

/** 言葉を取り出す。{n} などは p で差し替える */
function t(k, p){
  let s = (T[LANG] && T[LANG][k]) || T.en[k] || T.ja[k] || k;
  if (p) Object.keys(p).forEach(x => { s = s.split('{'+x+'}').join(p[x]); });
  return s;
}

/** data-t の付いた要素に流し込む */
function applyLang(){
  document.documentElement.lang = LANG;
  const nodes = document.querySelectorAll('[data-t]');
  for (let i = 0; i < nodes.length; i++){
    const k = nodes[i].getAttribute('data-t');
    if (nodes[i].tagName === 'INPUT') nodes[i].placeholder = t(k);
    else nodes[i].textContent = t(k);
  }
}

function setLang(v){
  LANG = v;
  localStorage.setItem('lang', v);
  location.reload();
}
